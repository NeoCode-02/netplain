name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # src/main/collectors/live.test.ts reads each runner's real adapters, so this matrix is also
  # the check that the Windows, macOS and Linux collectors still understand their OS.
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The built app on the runner's real network, driven over CDP (e2e/run.mjs). Needs the Electron binary.
  e2e:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e
      - if: runner.os != 'Linux'
        run: npm run e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ matrix.os }}
          path: e2e/shots
          if-no-files-found: ignore
